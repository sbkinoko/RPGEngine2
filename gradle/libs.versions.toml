[versions]
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activityCompose = "1.13.0"
compose = "1.10.5"
compose-plugin = "1.10.3"
kotlin = "2.3.20"
koin = "4.2.0"
koin-compose = "4.2.0"
realm = "3.0.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
